name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. NanumPlayer keeps privacy by default, pins every download and runs on Windows x64; proposals that fit that are easiest to accept.
        We do not accept requests to bundle copy-protection circumvention in the default download; see the [disc components](https://github.com/kimmingul/NanumPlayer/blob/main/docs/disc-components.md) page.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI subtitles
        - Subtitles (list, import, search, generation)
        - Video quality
        - YouTube or web pages
        - Discs
        - Installer and components
        - Interface and languages
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
